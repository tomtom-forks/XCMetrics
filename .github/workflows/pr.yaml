name: PR Checks

on:
  pull_request:
    branches: [main, tomtom-main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Run Tests
        run: swift test
